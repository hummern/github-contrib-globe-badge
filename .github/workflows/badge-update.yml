name: Update cobe profile badge
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-badge:
    runs-on: ubuntu-latest
    env:
      COMMIT_CACHE_PATH: commit-cache-${{ github.repository_owner }}.json
    steps:
      - uses: actions/checkout@v7
      - name: Restore commit cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.COMMIT_CACHE_PATH }}
          key: ${{ runner.os }}-commit-cache-v2-${{ github.repository_owner }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-commit-cache-v2-${{ github.repository_owner }}-
      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Generate badge.gif and data.json
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node badge/generate-badge.js
      - name: Save commit cache
        if: always() && hashFiles(env.COMMIT_CACHE_PATH) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.COMMIT_CACHE_PATH }}
          key: ${{ runner.os }}-commit-cache-v2-${{ github.repository_owner }}-${{ github.run_id }}
      - name: Replace turbolego with repository owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          sed -i "s/turbolego/$REPO_OWNER/g" index.html README.md
      - name: Commit badge and analytics data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update cobe profile badge data"
          file_pattern: 'badge.gif data.json commit-cache-*.json index.html README.md'
          branch: main
