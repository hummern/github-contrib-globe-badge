services:
  web:
    image: python:3.15-slim
    working_dir: /app
    command: ["python", "-m", "http.server", "80", "--bind", "0.0.0.0"]
    ports:
      - "3000:80"
    volumes:
      - ./:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
